<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0d0d12" />
  <meta name="description" content="Search and browse interactive one-page explainers from Uppercut Labs." />
  <meta name="application-name" content="Explainers" />
  <meta name="apple-mobile-web-app-title" content="Explainers" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Explainers" />
  <meta property="og:title" content="Explainers" />
  <meta property="og:description" content="Interactive one-page explainers, comparisons, and visual research artifacts." />
  <meta property="og:url" content="https://explainers.uppercut-labs.workers.dev/" />
  <meta property="og:image" content="https://explainers.uppercut-labs.workers.dev/icons/app-icon-512.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <link rel="icon" href="/icons/favicon.ico" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="/catalog.css" />
  <title>Explainers</title>
  <script src="/pwa.js" defer></script>
  <script src="/catalog.js" defer></script>
</head>
<body>
  <main>
    <header class="brand-hero">
      <img class="brand-logo" src="/brand/explainers-logo-512.webp" width="148" height="148" alt="" aria-hidden="true" />
      <div><div class="eyebrow">Uppercut Labs</div><h1>Explainers</h1><p class="intro">Interactive one-page explainers, comparisons, and visual research artifacts.</p><div class="hero-actions"><button id="install-app" class="install-app" type="button" hidden><img src="/icons/favicon-32x32.png" alt="" aria-hidden="true" />Install Explainers</button></div></div>
    </header>
    <section class="controls" aria-label="Explainer catalog controls">
      <label class="control" for="explainer-search"><span class="control-label">Search by title</span><span class="search-wrap"><svg class="search-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"></circle><path d="m16.5 16.5 4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path></svg><input id="explainer-search" type="search" autocomplete="off" placeholder="Search explainer titles…" /></span></label>
      <label class="control" for="explainer-sort"><span class="control-label">Sort</span><select id="explainer-sort"><option value="newest">Newest first</option><option value="oldest">Oldest first</option><option value="title-asc">Title A–Z</option><option value="title-desc">Title Z–A</option></select></label>
    </section>
    <div class="catalog-meta"><span id="catalog-status" role="status" aria-live="polite">Loading explainers…</span><button id="clear-search" class="clear" type="button" hidden>Clear search</button></div>
    <section id="explainer-grid" class="grid" aria-label="Explainer catalog"></section>
    <div id="empty-state" class="empty" hidden>No explainer titles match that search.</div>
    <noscript><div class="empty">JavaScript is required to load the explainer catalog.</div></noscript>
  </main>
</body>
</html>
